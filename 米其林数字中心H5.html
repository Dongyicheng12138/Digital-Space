<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米其林数字中心 · Digital Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2327509B'/%3E%3Cpath d='M10 16h12M16 10v12' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root{
    --michelin-blue:#27509B;
    --cyan:#4a90c2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:#0c1420;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}

  .phone{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;}
  @media (min-width:600px){
    body{display:flex;align-items:center;justify-content:center;
      background:radial-gradient(120% 120% at 50% 0%,#14243a 0%,#0a1120 100%);}
    .phone{max-width:430px;max-height:920px;height:94vh;border-radius:22px;
      box-shadow:0 30px 80px rgba(0,0,0,.55);}
  }

  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;will-change:opacity;}
  .slide.active{opacity:1;}
  .slide::before{content:"";position:absolute;inset:-24px;
    background-image:inherit;background-size:cover;background-position:center;
    filter:blur(28px) brightness(.5) saturate(1.15);}
  .slide img{position:relative;width:100%;height:100%;object-fit:contain;display:block;}
  .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,16,28,.55) 0%,rgba(8,16,28,0) 26%,rgba(8,16,28,0) 50%,rgba(6,12,22,.85) 100%);}

  .top{position:absolute;top:0;left:0;right:0;padding:26px 22px 0;z-index:5;}
  .brand{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:6px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 0 4px rgba(74,144,194,.25);}
  .brand small{font-size:12px;letter-spacing:.32em;font-weight:600;opacity:.9;}
  h1{color:#fff;font-size:25px;font-weight:700;letter-spacing:.06em;
    text-shadow:0 2px 18px rgba(0,0,0,.5);line-height:1.25;}
  h1 span{display:block;font-size:11px;font-weight:400;letter-spacing:.34em;
    opacity:.85;margin-top:4px;}

  .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 22px 30px;z-index:5;}
  .tag{display:inline-block;padding:5px 13px;border-radius:999px;
    background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
    color:#fff;font-size:12px;letter-spacing:.12em;margin-bottom:14px;}
  .subtitle{min-height:96px;display:flex;align-items:flex-end;}
  .subtitle p{color:#fff;font-size:17px;line-height:1.65;font-weight:500;
    text-shadow:0 2px 12px rgba(0,0,0,.65);
    opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease;}
  .subtitle p.show{opacity:1;transform:translateY(0);}
  .dots{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;}
  .dots i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);
    transition:background .4s;}
  .dots i.on{background:#fff;}

  .gate{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(90% 70% at 50% 45%,rgba(20,35,60,.55),rgba(8,14,26,.88));
    backdrop-filter:blur(2px);transition:opacity .6s,visibility .6s;}
  .gate.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .play{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:var(--michelin-blue);display:flex;align-items:center;
    justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.35);
    animation:pulse 2s ease-in-out infinite;}
  .play svg{width:30px;height:30px;margin-left:4px;}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.4);}
    50%{transform:scale(1.05);box-shadow:0 0 0 18px rgba(255,255,255,0);}}
  .gate p{color:#fff;font-size:15px;letter-spacing:.18em;}

  .mute{position:absolute;top:22px;right:20px;z-index:6;width:42px;height:42px;
    border-radius:50%;border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.22);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
  .mute svg{width:20px;height:20px;}
</style>
</head>
<body>
<div class="phone">

  <div class="slide active" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/LmOBbH3V8oD5IRxS2OScefPbnke')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/LmOBbH3V8oD5IRxS2OScefPbnke" alt="数字中心展厅">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Vdtpbjtcfou0rLxsXL9c9pCMnNf')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Vdtpbjtcfou0rLxsXL9c9pCMnNf" alt="沉浸式体验空间">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Xw7hb2Vj5oTNUAxRBAEcJOiVnbb')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Xw7hb2Vj5oTNUAxRBAEcJOiVnbb" alt="互动展项">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/XnVfb5ho6odCXdxbZUMcXzojnmb')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/XnVfb5ho6odCXdxbZUMcXzojnmb" alt="数字化展示">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/JA0wbe1eHop6JaxiFhicZ77anLd')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/JA0wbe1eHop6JaxiFhicZ77anLd" alt="未来工厂">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/HWK5bEoW5oSf7ox9NYBcL4TEn6f')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/HWK5bEoW5oSf7ox9NYBcL4TEn6f" alt="四足机器人">
  </div>
  <div class="slide" style="background-image:url('https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/CdasbMl0GoYkMfxdNtacV7oEnOf')">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/CdasbMl0GoYkMfxdNtacV7oEnOf" alt="价值创造中心展厅">
  </div>
  <div class="veil"></div>

  <div class="top">
    <div class="brand"><span class="dot"></span><small>MICHELIN · SWT</small></div>
    <h1>米其林数字中心<span>Digital Space</span></h1>
  </div>

  <div class="bottom">
    <span class="tag">数字科技 · 智能制造 · 5D沉浸</span>
    <div class="subtitle"><p id="sub"></p></div>
    <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <button class="mute" id="muteBtn" aria-label="声音开关">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
  </button>

  <div class="gate" id="gate">
    <button class="play" id="playBtn" aria-label="进入并播放">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p>轻触开启声音与字幕</p>
  </div>

  <audio id="voice" loop preload="auto"
    src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/LgGPb65EiooBdfxXV1PcvzQZn9f"></audio>
</div>

<script>
(function(){
  var slides=document.querySelectorAll('.slide');
  var dots=document.querySelectorAll('.dots i');
  var idx=0;
  setInterval(function(){
    slides[idx].classList.remove('active');
    dots[idx].classList.remove('on');
    idx=(idx+1)%slides.length;
    slides[idx].classList.add('active');
    dots[idx].classList.add('on');
  },6000);

  var SEG=[
    {t:0.0, text:"这里是一座融合数字科技与智能制造的沉浸式体验空间。"},
    {t:5.7, text:"在这里，您可以通过丰富的互动体验，了解未来工厂如何将 MR、VR 等数字化技术应用于生产制造过程。"},
    {t:16.5,text:"走进 5D 沉浸式空间，您将以全新的视角探索轮胎从原材料到成品的完整生产流程，近距离感受智能制造的魅力。"},
    {t:28.1,text:"数字中心内的巨型 LED 大屏还实时展示工厂的生产运行数据和能源管理数据，让原本复杂的数据变得直观可见、生动易懂。"},
    {t:40.5,text:"通过数字化技术，我们能够更加高效地管理生产、优化能源使用，并持续提升制造水平。"},
    {t:48.7,text:"欢迎来到米其林数字中心，感受数字科技与智能制造融合发展的前沿魅力。"}
  ];
  var sub=document.getElementById('sub');
  var curSeg=-1;
  function renderSeg(i){
    if(i===curSeg) return;
    curSeg=i;
    sub.classList.remove('show');
    setTimeout(function(){
      sub.textContent=SEG[i].text;
      sub.classList.add('show');
    },300);
  }

  var audio=document.getElementById('voice');
  var gate=document.getElementById('gate');
  var playBtn=document.getElementById('playBtn');
  var muteBtn=document.getElementById('muteBtn');
  var wave=document.getElementById('wave');

  audio.addEventListener('timeupdate',function(){
    var t=audio.currentTime;
    var n=SEG.length-1;
    for(var i=0;i<SEG.length;i++){
      if(t>=SEG[i].t) n=i;
    }
    renderSeg(n);
  });

  function startAudio(){
    audio.play().then(function(){gate.classList.add('hide');})
      .catch(function(){});
  }
  window.addEventListener('load',function(){setTimeout(startAudio,300);});
  playBtn.addEventListener('click',function(){
    audio.play();
    gate.classList.add('hide');
  });
  gate.addEventListener('click',function(e){
    if(e.target===gate){ audio.play(); gate.classList.add('hide'); }
  });

  muteBtn.addEventListener('click',function(){
    audio.muted=!audio.muted;
    wave.style.opacity=audio.muted?0:1;
    if(!audio.muted){ audio.play(); }
  });
})();
</script>
</body>
</html>
